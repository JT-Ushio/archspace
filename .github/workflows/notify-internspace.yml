name: Notify InternSpace

on:
  issues:
    types:
      - opened
      - labeled
      - unlabeled
  # Use the base repository's default-branch workflow so notifications also
  # work for pull requests opened from forks. This job never checks out or
  # executes pull-request code.
  pull_request_target:
    types:
      - closed
      - labeled
      - unlabeled
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        contains(github.event.issue.labels.*.name, 'architecture proposal')) ||
      (github.event_name == 'issues' &&
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        (contains(github.event.issue.labels.*.name, 'architecture proposal') ||
          github.event.label.name == 'architecture proposal')) ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action == 'labeled' || github.event.action == 'unlabeled')) ||
      (github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true)
    name: Dispatch Pages rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Require destination credential
        env:
          INTERNSPACE_DISPATCH_TOKEN: ${{ secrets.INTERNSPACE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$INTERNSPACE_DISPATCH_TOKEN" ]; then
            echo "::error::Repository secret INTERNSPACE_DISPATCH_TOKEN is not configured."
            exit 1
          fi

      - name: Notify InternSpace
        env:
          GH_TOKEN: ${{ secrets.INTERNSPACE_DISPATCH_TOKEN }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_ACTION: ${{ github.event.action || 'manual' }}
          SOURCE_PR_MERGED: ${{ github.event.pull_request.merged || false }}
          SOURCE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          action="$SOURCE_ACTION"
          if [ "$SOURCE_EVENT" = "pull_request_target" ] \
            && [ "$SOURCE_ACTION" = "closed" ] \
            && [ "$SOURCE_PR_MERGED" = "true" ]; then
            action="merged"
          fi

          payload="$(
            jq -n \
              --arg event "$SOURCE_EVENT" \
              --arg action "$action" \
              --arg number "$SOURCE_NUMBER" \
              --arg run_id "$SOURCE_RUN_ID" \
              '{
                event_type: "template-test-changed",
                client_payload: {
                  source_repository: "InternLM/archspace/",
                  event: $event,
                  action: $action,
                  number: $number,
                  source_run_id: $run_id
                }
              }'
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Feanus/archspace/dispatches \
            --data "$payload"
