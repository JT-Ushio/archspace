[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olmo-mla-morphnorm"
version = "0.1.0"
description = "MLA and MorphNorm sequence mixer for OLMo-core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai2-olmo-core @ git+https://github.com/allenai/OLMo-core.git@064b172e51695259b40684b12ccf10e6e71ad46c",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.15.9"]
training = ["ai2-olmo-eval==0.9.0", "wandb"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["olmo_mla_morphnorm*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
